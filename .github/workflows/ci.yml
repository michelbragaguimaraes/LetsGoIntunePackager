name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the latest run for a branch or PR is useful; cancel the rest.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth; bumping go.mod bumps CI with it.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

      # The race detector roughly triples the runtime, and nothing here is
      # platform-specific about concurrency, so one platform covers it.
      - name: Test with race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -count=1 -race

  lint:
    name: vet and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted. Run 'make fmt'."
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Every target published on the releases page, so a platform-specific
      # break is caught here rather than at release time.
      - name: Build every released target
        run: |
          set -euo pipefail
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null .
          done
